name: caller-choice-nodefault
on:
  workflow_dispatch:
    inputs:
      box:
        description: which box
        required: true
        type: choice
        options: [beast, crunch-admin]   # T3: deliberately NO default
permissions:
  contents: read
jobs:
  call:
    uses: ./.github/workflows/impl.yml
    with:
      runner_label: ubuntu-latest
      box: ${{ inputs.box }}
