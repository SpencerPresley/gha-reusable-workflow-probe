name: caller-main
on: {workflow_dispatch: {inputs: {box: {required: true, type: string, default: crunch-admin}}}}
concurrency: {group: probe-main, cancel-in-progress: false}
permissions:
  contents: read
jobs:
  call:
    uses: ./.github/workflows/impl.yml     # T4: same-repo local reference
    with:
      runner_label: ubuntu-latest
      box: ${{ inputs.box }}
