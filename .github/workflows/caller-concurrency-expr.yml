name: caller-concurrency-expr
on:
  workflow_dispatch:
    inputs:
      box: {required: true, type: string, default: beast}
# T6: can workflow-level concurrency.group read the inputs context?
concurrency: {group: probe-${{ inputs.box }}, cancel-in-progress: false}
permissions:
  contents: read
jobs:
  call:
    uses: ./.github/workflows/impl.yml
    with:
      runner_label: ubuntu-latest
      box: ${{ inputs.box }}
