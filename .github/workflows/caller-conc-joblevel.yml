name: caller-conc-joblevel
on:
  workflow_dispatch:
    inputs:
      box: {required: true, type: string, default: beast}
permissions:
  contents: read
jobs:
  call:
    concurrency: {group: probe-job-${{ inputs.box }}, cancel-in-progress: false}
    uses: ./.github/workflows/impl.yml
    with: {runner_label: ubuntu-latest, box: "${{ inputs.box }}"}
